schema_version: 4
base_config: ../config.yaml

experiment:
  name: phase1_exp5_2_dense_token_fusion_validation
  result_root: research/results/phase1-dpvo-feasibility/exp5/dense_fusion_validation

environment:
  vjepa_python: /home/hx/miniforge3/envs/vjepa/bin/python

dataset:
  smoke_sequence: MH_01_easy
  smoke_frames: 8

feature_hook:
  primary: patchifier.fnet.output
  alternative: patchifier.forward.fmap_gmap_boundary
  dpvo_channels: 128
  expected_spatial_shape: [120, 188]
  fnet_scale: 4.0

jepa:
  expected_token_shape: [576, 768]
  token_grid: [24, 24]

fusion:
  alpha: 0.1
  methods:
    - dpvo_baseline
    - random_dense_projection_fusion
    - jepa_dense_projection_fusion

oracle:
  keyframe_stride: 5
  methods:
    - dpvo_baseline
    - oracle_jepa_missing_rgb
  output_subdirectory: oracle_missing_rgb
  strong_ate_degradation: 0.05
  feasible_ate_degradation: 0.10

projection:
  input_dim: 768
  output_dim: 128
  token_count: 576
  token_grid: [24, 24]
  epochs: 50
  batch_size: 8
  validation_interval: 5
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  random_seed: 4321
  memory_safety_factor: 1.25

evaluation:
  sequences:
    - MH_01_easy
    - MH_03_medium
    - MH_05_difficult
  groundtruth_pattern: datasets/euroc_groundtruth/{sequence}.txt
  strong_ate_degradation: 0.05
  feasible_ate_degradation: 0.10

schema_version: 3

experiment:
  name: phase1_exp4_jepa_dpvo_bridge
  seed: 1234
  result_root: research/results/phase1-dpvo-feasibility/exp4

dataset:
  dataset_type: euroc
  root: research/assets/datasets/euroc
  groups: [machine_hall, vicon_room1, vicon_room2]
  camera: cam0
  stride: 2
  skip: 0
  smoke_frames_per_sequence: 8
  splits:
    train: [MH_01_easy]
    val: [MH_03_medium]
    test: [MH_05_difficult]

paths:
  calibration: calib/euroc.txt
  dpvo_checkpoint: research/assets/models/dpvo.pth
  dpvo_config: config/default.yaml

runtime:
  jepa_python: /home/hx/miniforge3/envs/vjepa/bin/python
  dpvo_python: /home/hx/miniforge3/envs/dpvo/bin/python

jepa:
  repo: /home/hx/vjepa2-research
  checkpoint: research/assets/model/vjepa2_1_vitb_dist_vitG_384.pt
  checkpoint_sha256: 848a77c33cc9e6649ed2119c9bea1e2c569bcdab9539ff3e7c02ccc2959ddf4d
  expected_git_commit: be4a39cf6252ee003dbe96f22176529c5c0a39c9
  model_alias: vjepa2_1_vit_base_384
  model_name: V-JEPA 2.1 ViT-B/16 384
  encoder: ema
  layer: final
  token_type: dense
  normalization: none
  crop_size: 384
  patch_size: 16
  batch_size: 4
  expected_grid_shape: [24, 24]
  expected_shape: [576, 768]

dpvo_fmap:
  checkpoint_sha256: 30d02dc2b88a321cf99aad8e4ea1152a44d791b5b65bf95ad036922819c0ff12
  config_sha256: 0351abfbc60d9ec93bf402857130497b2f063f8ce0e8fd6e87cc55c73273594a
  fmap_channels: 128
  spatial_scale: 4
  reference_shape: [128, 120, 188]
  shape_policy: strict
  mixed_precision: true
  sanity:
    sample_count: 3
    seed: 1234
    max_abs_error: 1.0e-6
    mean_abs_error: 1.0e-7
    min_cosine_similarity: 0.99999

adapter:
  input_tokens: 576
  input_dim: 768
  token_grid: [24, 24]
  hidden_dim: 256
  transformer_layers: 2
  attention_heads: 8
  feedforward_dim: 1024
  dropout: 0.1
  decoder_sizes: [[60, 94], [120, 188]]
  output_channels: 128
  output_shape: [128, 120, 188]
  max_parameters: 20000000

capacity_profiles:
  small: {hidden_dim: 256}
  medium: {hidden_dim: 512}
  large: {hidden_dim: 768}

low_rank_linear:
  input_shape: [576, 768]
  output_shape: [128, 120, 188]
  rank: 16

loss:
  cosine_weight: 1.0
  l2_weight: 0.1
  eps: 1.0e-8

training:
  bridge_epochs: 50
  capacity_epochs: 100
  batch_size: 8
  smoke_epochs: 1
  smoke_batch_size: 2
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  num_workers: 0
  pin_memory: true
  best_metric: val_total_loss

evaluation:
  seed: 1234
  visualization_samples: 3
  eps: 1.0e-8

retrieval_analysis:
  seed: 1234
  batch_size: 4
  query_chunk_size: 128
  top_k: 5

capacity_decision:
  relative_improvement_threshold: 0.01
  eps: 1.0e-8

normalization:
  jepa: {type: none}
  dpvo_fmap: {type: none}

storage:
  jepa_dtype: float16
  fmap_dtype: float16
  original_compute_dtype: float32
  dataset_output_dtype: float32

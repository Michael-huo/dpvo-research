name: dpvo

channels:
  - conda-forge

dependencies:
  # Core environment
  - python=3.10.14
  - pip
  - cmake=3.22.2

  # Python dependencies
  - pip:
      # PyTorch CUDA 12.1 wheels
      - --extra-index-url https://download.pytorch.org/whl/cu121

      # PyG wheels matched to PyTorch 2.3.1 + CUDA 12.1
      - --find-links https://data.pyg.org/whl/torch-2.3.1+cu121.html

      # PyTorch stack
      - torch==2.3.1+cu121
      - torchvision==0.18.1+cu121
      - torchaudio==2.3.1+cu121
      - torch-scatter==2.1.2+pt23cu121

      # DPVO runtime dependencies
      - numpy==2.2.6
      - scipy==1.15.3
      - matplotlib==3.10.9
      - tensorboard==2.21.0
      - numba==0.66.0
      - tqdm==4.70.0
      - einops==0.8.2
      - pypose==0.9.5
      - kornia==0.8.2
      - plyfile==1.1.5
      - evo==1.37.0
      - opencv-python==5.0.0.93
      - yacs==0.1.8

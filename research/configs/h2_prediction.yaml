schema_version: 1
experiment:
  name: h2_prediction
  seed: 1234
  training_sequence: MH_01_easy
  default_sequences: [MH_01_easy]
  supported_sequences: [MH_01_easy, MH_03_medium, MH_05_difficult]
  bootstrap_accepted_nodes: 8
  post_bootstrap_anchor_interval: 5
  anchor_ratio: 0.2
  deployment_mode: delayed_bracketed
  strict_deployment: true
  timestamp_causal: false
dataset:
  dataset_type: euroc
  root: research/assets/datasets/euroc
  groups: [machine_hall, vicon_room1, vicon_room2]
  camera: cam0
  stride: 2
  skip: 0
  groundtruth_pattern: datasets/euroc_groundtruth/{sequence}.txt
paths:
  calibration: calib/euroc.txt
  dpvo_checkpoint: research/assets/models/dpvo.pth
  dpvo_config: config/default.yaml
  h1_bridge: research/checkpoints/h1-interface/bridge.pt
  h2_predictor: research/checkpoints/h2-prediction/predictor.pt
  output_root: research/results/h2-prediction
runtime:
  jepa_python: /home/hx/miniforge3/envs/vjepa/bin/python
jepa:
  repo: /home/hx/vjepa2-research
  checkpoint: research/assets/model/vjepa2_1_vitb_dist_vitG_384.pt
  checkpoint_sha256: 848a77c33cc9e6649ed2119c9bea1e2c569bcdab9539ff3e7c02ccc2959ddf4d
  expected_git_commit: be4a39cf6252ee003dbe96f22176529c5c0a39c9
  model_alias: vjepa2_1_vit_base_384
  layer_zero_based: 5
  target_height: 384
  patch_size: 16
  batch_size: 4
  feature_dim: 768
teacher: {fmap_channels: 128, fmap_scale: 4}
bridge:
  architecture: block5_coordinate_correct_shallow_spatial_v1
  layer_zero_based: 5
  hidden_channels: 160
predictor:
  architecture: robust_transport_block5_residual_spatial
  feature_dim: 768
  hidden_dim: 256
  difference_dim: 128
  reliability_dim: 32
  residual_blocks: 2
  group_norm_groups: 16
  time_hidden_dim: 128
split:
  method: interval_contiguous_60_20_20_drop_shared_boundaries_v1
  train_fraction: 0.60
  validation_fraction: 0.20
  expected_counts:
    train: {intervals: 219, queries: 876}
    validation: {intervals: 72, queries: 288}
    test: {intervals: 73, queries: 292}
training:
  epochs: 30
  intervals_per_batch: 2
  optimizer: adamw
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: none
  amp: true
  cosine_weight: 1.0
  smooth_l1_weight: 0.1
  checkpoint_selector: lowest_validation_total
tiny_overfit:
  intervals: 8
  max_steps: 200
  absolute_improvement_tolerance: 1.0e-4
  relative_improvement_tolerance: 1.0e-3
transport:
  threshold_calibration_population: train_endpoint_pairs_only
  cycle_confidence_sigma_tokens: 1.5
evaluation:
  rpe_horizon_seconds: 1.0
  rpe_pair_tolerance_ns: 1000000
  groundtruth_max_association_ns: 20000000
diagnostics:
  sampled_hidden_frames_per_sequence: 6
  seed: 1234
  artifact: feature_diagnostics.png

admission:
  type: uniform_budgeted
  hidden_count: n = stride - 1; complete anchor bracket
  k_rule: K = n // 2
  ordinal_rule: 1 + ((2*j + 1)*n // (2*K)), j=0..K-1; one-based
  order: strictly increasing hidden timestamp_ns
  zero_budget: empty selection
  anchors: all submitted to native DPVO
  generation: all hidden predictor + H1 Bridge + FMap packets
  gate: after FMap packet construction, before native packet conversion and DPVO insertion
canonical_predictor:
  state_dict_sha256: 4d33a2dfdcc0eb6965d5bb9788ac272dd6a969f5d41bd7169111e7bc77f139c8
  training_lineage_sha256: 2e2285a22f869a2674fe4c81428e2a4150abd82fbfd062b7981dd498426277d4
  best_epoch: 12
